<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Monday SDK</title>

</head>
<body>
  <h2>Test Monday SDK 9</h2>
  <p id="message"></p>

  <script>
  const monday = window.mondaySdk();
  
    if (monday) {
      document.getElementById("message").innerText = "Monday SDK loaded successfully!";
	   //monday.storage.setItem('client_id', '123');
       //monday.storage.setItem('client_secret', '456');
	   const clientId =  monday.storage.getItem("client_id");
      const clientSecret =  monday.storage.getItem("client_secret");
	  debugger;
	  alert(clientId.data + ' ' + clientSecret.data);
    } else {
      document.getElementById("message").innerText = "Error: Monday SDK not loaded.";
    }
  </script>
