<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Monday SDK</title>
  <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
</head>
<body>
  <h2>Test Monday SDK 15</h2>
  <p id="message"></p>

  <script>
  const monday = window.mondaySdk();
  
    if (monday) {
      document.getElementById("message").innerText = "Monday SDK loaded successfully!";
      
      // Retrieving the stored items
      monday.storage.getItem("client_id").then(clientId => {
        monday.storage.getItem("client_secret").then(clientSecret => {
          // Log the entire object to inspect its structure
          console.log("clientId object:", clientId);
          console.log("clientSecret object:", clientSecret);
          debugger;
          // Inspecting the object structure in the console
          if (clientId && clientId.data) {
            console.log("clientId value:", clientId.data); // Check the structure
          }
          if (clientSecret && clientSecret.data) {
            console.log("clientSecret value:", clientSecret.data); // Check the structure
          }
          
          // If data exists, display it, otherwise show a fallback message
          alert((clientId && clientId.data) ? clientId.data.value : 'No client_id found' + ' ' + (clientSecret && clientSecret.data) ? clientSecret.data.value : 'No client_secret found');
        }).catch(error => {
          console.error("Error retrieving client_secret: ", error);
        });
      }).catch(error => {
        console.error("Error retrieving client_id: ", error);
      });
    } else {
      document.getElementById("message").innerText = "Error: Monday SDK not loaded.";
    }
  </script>
</body>
</html>
