<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Monday SDK</title>
  <script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
</head>
<body>
  <h2>Test Monday SDK 1</h2>
  <p id="message"></p>

  <script>
    if (window.monday) {

    } else {
      document.getElementById("message").innerText = "Error: Monday SDK not loaded.";
    }
  </script>
</body>
</html>
